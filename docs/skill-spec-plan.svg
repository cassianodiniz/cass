<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 780" width="600" height="780" role="img" aria-labelledby="t d">
<title id="t">spec-plan · aprovar uma feature</title>
<desc id="d">Investiga em rodadas, verifica os nove requisitos esquecidos, define o tamanho e escreve a spec. Contexto é condicional; design e tarefas formais são para Large e Complex. Os documentos recebem um sim só, no fim. Esse sim publica a pasta da feature, cria uma issue com link, abre a PR em rascunho e inicia implementar.</desc>
<style>svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--ns:#d1d9e0}
@media(prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#a6b0bb;--ln:#9198a1;--ns:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--mu);font-size:13px}
.h{font-size:16px;font-weight:600;fill:var(--tx)}
.small{font-size:12px}.title{font-size:18px;font-weight:700;fill:var(--tx)}
.nb rect{fill:transparent;stroke:var(--ns);stroke-width:1.2}
.hot rect{fill:#0f6e56;stroke:#0f6e56;stroke-width:1.2}.hot text{fill:#fff}
.ln{fill:none;stroke:var(--ln);stroke-width:1.4}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9"/></marker></defs>
<text class="title" x="300" y="30" text-anchor="middle">spec-plan · aprovar uma feature</text>
<g class="nb"><rect x="55" y="60" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="85" text-anchor="middle">Entender o pedido</text>
<text class="" x="300.0" y="107" text-anchor="middle">Perguntas em rodadas, com recomendação.</text>
<text class="" x="300.0" y="126" text-anchor="middle">Fatos: o agente busca. Decisões: você escolhe.</text>
</g>
<path class="ln" d="M300 140 V164" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="168" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="193" text-anchor="middle">Fechar o comportamento</text>
<text class="" x="300.0" y="215" text-anchor="middle">Glossário do projeto e nove requisitos esquecidos.</text>
<text class="" x="300.0" y="234" text-anchor="middle">Preferir a solução mais simples que atende ao pedido.</text>
</g>
<path class="ln" d="M300 248 V272" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="276" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="301" text-anchor="middle">Escrever os documentos necessários</text>
<text class="" x="300.0" y="323" text-anchor="middle">Sempre spec; contexto quando há pontos a esclarecer.</text>
<text class="" x="300.0" y="342" text-anchor="middle">Design e tarefas formais só em Large/Complex.</text>
</g>
<path class="ln" d="M300 356 V380" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="384" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="409" text-anchor="middle">Um sim só, no fim</text>
<text class="" x="300.0" y="431" text-anchor="middle">O agente explica resultado, limites, custo e tamanho.</text>
<text class="" x="300.0" y="450" text-anchor="middle">Pediu ajuste? Reescreve antes de avançar.</text>
</g>
<path class="ln" d="M300 464 V488" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="492" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="517" text-anchor="middle">Com o sim: publicar</text>
<text class="" x="300.0" y="539" text-anchor="middle">Commit e push da pasta da feature na branch.</text>
<text class="" x="300.0" y="558" text-anchor="middle">Uma issue com o link e uma PR em rascunho.</text>
</g>
<path class="ln" d="M300 572 V596" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="600" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="625" text-anchor="middle">Começar implementar</text>
<text class="" x="300.0" y="647" text-anchor="middle">Depois de publicar, a construção começa.</text>
<text class="" x="300.0" y="666" text-anchor="middle">Sem uma nova pergunta para iniciar.</text>
</g>
<text class="small" x="300" y="716" text-anchor="middle">Uma feature = uma branch + uma issue + uma PR.</text>
<text class="small" x="300" y="736" text-anchor="middle">Pausa antes do sim: publicar só com autorização.</text>
<text class="small" x="300" y="760" text-anchor="middle">Verde: sua decisão. Setas: sequência do trabalho.</text>
</svg>
