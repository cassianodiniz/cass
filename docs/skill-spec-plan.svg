<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 810" width="520" height="810" role="img" aria-labelledby="t d">
<title id="t">Como a spec-plan funciona</title>
<desc id="d">A spec-plan entrevista em rodadas, passa pelos 9 requisitos que ninguém escreve e só segue com o seu sim. Escreve o plano fatiado em partes num rascunho, conta o plano em passos e pergunta se você aprova; se pedir ajuste, refaz o rascunho. A mensagem diz em quantas partes, traz as três perguntas de tamanho e onde o plano vai morar. Um sim publica: no GitHub, uma issue do plano e uma por parte, ligadas; sem GitHub, em docs/plans. Depois oferece construir o plano inteiro numa sessão.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="48.5" y="20" width="283" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">uma ideia ou mudança ainda solta</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="78" width="300" height="64" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">entrevista em rodadas</text><text class="s" x="190" y="117" text-anchor="middle">perguntas com a resposta recomendada;</text><text class="s" x="190" y="134" text-anchor="middle">fato do projeto ela mesma busca</text></g>
<line class="ln" x1="190" y1="142" x2="190" y2="164" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="166" width="300" height="64" rx="4"/><text class="h" x="190" y="187" text-anchor="middle">os 9 que ninguém escreve</text><text class="s" x="190" y="205" text-anchor="middle">validação, falhas, repetição, permissão, ordem,</text><text class="s" x="190" y="222" text-anchor="middle">dados, serviço fora do ar, estados e registro</text></g>
<line class="ln" x1="190" y1="230" x2="190" y2="252" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="254" width="300" height="47" rx="4"/><text class="h" x="190" y="275" text-anchor="middle">Entendemos a mesma coisa?</text><text class="s" x="190" y="293" text-anchor="middle">só passa pro plano com o seu sim</text></g>
<line class="ln" x1="190" y1="301" x2="190" y2="323" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="325" width="300" height="64" rx="4"/><text class="h" x="190" y="346" text-anchor="middle">escreve o plano e fatia em partes</text><text class="s" x="190" y="364" text-anchor="middle">rascunho fora do projeto; cada parte cabe</text><text class="s" x="190" y="381" text-anchor="middle">numa sessão e tem como provar que ficou pronta</text></g>
<line class="ln" x1="190" y1="389" x2="190" y2="411" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="413" width="300" height="64" rx="4"/><text class="h" x="190" y="434" text-anchor="middle">mensagem de aprovação</text><text class="s" x="190" y="452" text-anchor="middle">quantas partes, as 3 perguntas de tamanho</text><text class="s" x="190" y="469" text-anchor="middle">e onde o plano mora: GitHub ou arquivos</text></g>
<line class="ln" x1="190" y1="477" x2="190" y2="499" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="501" width="300" height="47" rx="4"/><text class="h" x="190" y="522" text-anchor="middle">Aprova?</text><text class="s" x="190" y="540" text-anchor="middle">um sim só publica tudo; ou pede ajuste</text></g>
<line class="ln" x1="190" y1="548" x2="190" y2="570" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="572" width="300" height="47" rx="4"/><text class="h" x="190" y="593" text-anchor="middle">publica no destino</text><text class="s" x="190" y="611" text-anchor="middle">GitHub: plano + 1 issue por parte; ou docs/plans</text></g>
<line class="ln" x1="190" y1="619" x2="190" y2="641" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="643" width="300" height="47" rx="4"/><text class="h" x="190" y="664" text-anchor="middle">Constrói o plano inteiro?</text><text class="s" x="190" y="682" text-anchor="middle">implementar ou gpt-implementar</text></g>
<line class="ln" x1="190" y1="690" x2="190" y2="712" marker-end="url(#a)"/>
<rect class="pill" x="70" y="714" width="240" height="34" rx="17"/><text class="h" x="190" y="736" text-anchor="middle">o plano todo numa sessão</text>
<path class="bk" d="M340 524 H362 V357 H342" marker-end="url(#b)"/>
<text class="lb" x="370" y="433" text-anchor="start"><tspan x="370" dy="0">pediu ajuste:</tspan><tspan x="370" dy="15">refaz o rascunho</tspan></text>
<line x1="16" y1="770" x2="504" y2="770" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="779" width="14" height="12" rx="2"/></g>
<text x="44" y="789">em verde: ela para e espera você</text>
<line class="bk" x1="252" y1="785" x2="274" y2="785"/>
<text x="280" y="789">tracejado: volta ou atalho</text>
</svg>
