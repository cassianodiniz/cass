<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 617" width="520" height="617" role="img" aria-labelledby="t d">
<title id="t">Como a search funciona</title>
<desc id="d">A search mede o tamanho da pergunta e só pergunta a profundidade quando ela é ambígua. Subagentes buscam em paralelo no Exa; ela confere o relato de cada um antes de confiar e faz nova passada se faltou cobertura. Cada número sai com página, frase e data, tudo fica guardado em search-findings e a resposta traz a fonte de cada dado.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="45" y="20" width="290" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">uma pergunta que precisa de fonte</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="78" width="300" height="64" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">mede o tamanho da pergunta</text><text class="s" x="190" y="117" text-anchor="middle">simples: ela mesma busca;</text><text class="s" x="190" y="134" text-anchor="middle">complexa: divide entre subagentes</text></g>
<line class="ln" x1="190" y1="142" x2="190" y2="164" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="166" width="300" height="47" rx="4"/><text class="h" x="190" y="187" text-anchor="middle">Busca rápida ou varredura funda?</text><text class="s" x="190" y="205" text-anchor="middle">só pergunta quando o tamanho é ambíguo</text></g>
<line class="ln" x1="190" y1="213" x2="190" y2="235" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="237" width="300" height="47" rx="4"/><text class="h" x="190" y="258" text-anchor="middle">subagentes buscam em paralelo</text><text class="s" x="190" y="276" text-anchor="middle">buscas no Exa, cada um na sua fatia</text></g>
<line class="ln" x1="190" y1="284" x2="190" y2="306" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="308" width="300" height="47" rx="4"/><text class="h" x="190" y="329" text-anchor="middle">confere o relato de cada subagente</text><text class="s" x="190" y="347" text-anchor="middle">antes de confiar no que veio</text></g>
<line class="ln" x1="190" y1="355" x2="190" y2="377" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="379" width="300" height="47" rx="4"/><text class="h" x="190" y="400" text-anchor="middle">cada número com página, frase e data</text><text class="s" x="190" y="418" text-anchor="middle">sem fonte, sai ou vira lacuna declarada</text></g>
<line class="ln" x1="190" y1="426" x2="190" y2="448" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="450" width="300" height="47" rx="4"/><text class="h" x="190" y="471" text-anchor="middle">guarda tudo no projeto</text><text class="s" x="190" y="489" text-anchor="middle">search-findings/&lt;tema&gt;-&lt;data&gt;/</text></g>
<line class="ln" x1="190" y1="497" x2="190" y2="519" marker-end="url(#a)"/>
<rect class="pill" x="33.5" y="521" width="313" height="34" rx="17"/><text class="h" x="190" y="543" text-anchor="middle">a resposta, com a fonte de cada dado</text>
<path class="bk" d="M340 331 H362 V260 H342" marker-end="url(#b)"/>
<text class="lb" x="370" y="288" text-anchor="start"><tspan x="370" dy="0">faltou cobertura:</tspan><tspan x="370" dy="15">nova passada</tspan></text>
<line x1="16" y1="577" x2="504" y2="577" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="586" width="14" height="12" rx="2"/></g>
<text x="44" y="596">em verde: ela para e espera você</text>
<line class="bk" x1="252" y1="592" x2="274" y2="592"/>
<text x="280" y="596">tracejado: volta ou atalho</text>
</svg>
