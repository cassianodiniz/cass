<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="t d">
<title id="t">Como a handoff funciona</title>
<desc id="d">A handoff oferece commit das mudanças deste trabalho e respeita a resposta. Registra branch, HEAD e pendências locais, preserva decisões e motivos da conversa, referencia arquivos existentes, salva em .claude/handoffs e entrega uma frase com o caminho completo para retomar.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="10.5" y="20" width="359" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">a conversa vai fechar, o trabalho continua</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="78" width="300" height="47" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">confere o git</text><text class="s" x="190" y="117" text-anchor="middle">mudanças deste trabalho sem commit?</text></g>
<line class="ln" x1="190" y1="125" x2="190" y2="147" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="149" width="300" height="47" rx="4"/><text class="h" x="190" y="170" text-anchor="middle">Quer commitar antes do handoff?</text><text class="s" x="190" y="188" text-anchor="middle">sim: commita · não: segue sem commit</text></g>
<line class="ln" x1="190" y1="196" x2="190" y2="218" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="220" width="300" height="47" rx="4"/><text class="h" x="190" y="241" text-anchor="middle">registra o ponto de referência</text><text class="s" x="190" y="259" text-anchor="middle">branch + HEAD; pendências locais à parte</text></g>
<line class="ln" x1="190" y1="267" x2="190" y2="289" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="291" width="300" height="47" rx="4"/><text class="h" x="190" y="312" text-anchor="middle">preserva o contexto da conversa</text><text class="s" x="190" y="330" text-anchor="middle">decisões, motivos, limites e próximo passo</text></g>
<line class="ln" x1="190" y1="338" x2="190" y2="360" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="362" width="300" height="47" rx="4"/><text class="h" x="190" y="383" text-anchor="middle">referencia os arquivos existentes</text><text class="s" x="190" y="401" text-anchor="middle">separa fatos, sugestões e lacunas</text></g>
<line class="ln" x1="190" y1="409" x2="190" y2="431" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="433" width="300" height="47" rx="4"/><text class="h" x="190" y="454" text-anchor="middle">salva em .claude/handoffs/</text><text class="s" x="190" y="472" text-anchor="middle">falhas e pendências registradas; sem segredos</text></g>
<line class="ln" x1="190" y1="480" x2="190" y2="502" marker-end="url(#a)"/>
<rect class="pill" x="29.5" y="504" width="321" height="34" rx="17"/><text class="h" x="190" y="526" text-anchor="middle">frase com caminho completo para retomar</text>
<path class="bk" d="M340 101 H362 V243 H342" marker-end="url(#b)"/>
<text class="lb" x="370" y="165" text-anchor="start"><tspan x="370" dy="0">sem mudanças:</tspan><tspan x="370" dy="15">segue direto</tspan></text>
<line x1="16" y1="560" x2="504" y2="560" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="569" width="14" height="12" rx="2"/></g>
<text x="44" y="579">em verde: ela para e espera você</text>
<line class="bk" x1="252" y1="575" x2="274" y2="575"/>
<text x="280" y="579">tracejado: volta ou atalho</text>
</svg>
