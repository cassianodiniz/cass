<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 547" width="520" height="547" role="img" aria-labelledby="t d">
<title id="t">Como a aprender-com-a-sessao funciona</title>
<desc id="d">A aprender-com-a-sessao entra quando uma sessão de código terminou. Lê o manual de escrita que vem dentro dela e o registro da sessão, o caminho inteiro e não só o resultado. Procura onde o ambiente falhou: achar arquivos, checagens automáticas, regras do revisor, CLAUDE.md inchado, ferramenta cara, frase inútil e falta de informação. Guarda a lista, do mais grave ao menos grave, em docs/aprendizados/ do repositório, e você decide o que resolver agora; o resto fica pendente pra revisar depois.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="55" y="20" width="270" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">uma sessão de código terminou</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="78" width="300" height="47" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">lê o manual de escrita</text><text class="s" x="190" y="117" text-anchor="middle">writing-for-agents, dentro da skill</text></g>
<line class="ln" x1="190" y1="125" x2="190" y2="147" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="149" width="300" height="47" rx="4"/><text class="h" x="190" y="170" text-anchor="middle">lê o registro da sessão</text><text class="s" x="190" y="188" text-anchor="middle">o caminho inteiro, não só o resultado</text></g>
<line class="ln" x1="190" y1="196" x2="190" y2="218" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="220" width="300" height="81" rx="4"/><text class="h" x="190" y="241" text-anchor="middle">procura onde o ambiente falhou</text><text class="s" x="190" y="259" text-anchor="middle">achar arquivos, checagens automáticas,</text><text class="s" x="190" y="276" text-anchor="middle">regras do revisor, CLAUDE.md inchado,</text><text class="s" x="190" y="293" text-anchor="middle">ferramenta cara, frase inútil, falta de dado</text></g>
<line class="ln" x1="190" y1="301" x2="190" y2="323" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="325" width="300" height="47" rx="4"/><text class="h" x="190" y="346" text-anchor="middle">guarda a lista no repositório</text><text class="s" x="190" y="364" text-anchor="middle">docs/aprendizados/, tudo pendente</text></g>
<line class="ln" x1="190" y1="372" x2="190" y2="394" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="396" width="300" height="47" rx="4"/><text class="h" x="190" y="417" text-anchor="middle">O que resolver agora?</text><text class="s" x="190" y="435" text-anchor="middle">o resto fica pendente pro revisar</text></g>
<line class="ln" x1="190" y1="443" x2="190" y2="465" marker-end="url(#a)"/>
<rect class="pill" x="55" y="467" width="270" height="34" rx="17"/><text class="h" x="190" y="489" text-anchor="middle">a próxima sessão tropeça menos</text>
<line x1="16" y1="517" x2="504" y2="517" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="526" width="14" height="12" rx="2"/></g>
<text x="44" y="536">em verde: ela para e espera você</text>
</svg>
