<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 730" width="520" height="730" role="img" aria-labelledby="t d">
<title id="t">O plano inteiro numa sessão</title>
<desc id="d">Com o plano publicado no GitHub, um sim cobre todas as partes. A sessão cria o ramo do plano e, parte por parte, em ordem: marca dono, constrói como uma tarefa, passa na build-review (reprovou: conserta até 2 vezes) e sobe na PR rascunho com bilhete na issue, sem perguntar. Para e chama você numa parte só sua, depois de 2 consertos falhos ou numa decisão fora do plano. No fim, revisão final do plano inteiro; reprovou, volta a quem fez. Aprovada, a PR sai do rascunho e o merge é sempre seu.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="55" y="20" width="270" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">plano publicado no GitHub</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="78" width="300" height="47" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">Constrói o plano inteiro?</text><text class="s" x="190" y="117" text-anchor="middle">um sim cobre todas as partes</text></g>
<line class="ln" x1="190" y1="125" x2="190" y2="147" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="149" width="300" height="47" rx="4"/><text class="h" x="190" y="170" text-anchor="middle">ramo do plano</text><text class="s" x="190" y="188" text-anchor="middle">plano/&lt;n&gt;-&lt;nome&gt;, saindo da main</text></g>
<line class="ln" x1="190" y1="196" x2="190" y2="222" marker-end="url(#a)"/>
<rect x="24" y="224" width="332" height="246" rx="6" fill="none" stroke="var(--ns)" stroke-dasharray="4 3"/><text x="190" y="242" text-anchor="middle">cada parte, em ordem</text>
<g class="nb"><rect x="40" y="252" width="300" height="64" rx="4"/><text class="h" x="190" y="273" text-anchor="middle">marca dono e constrói</text><text class="s" x="190" y="291" text-anchor="middle">igual a uma tarefa:</text><text class="s" x="190" y="308" text-anchor="middle">marco de início, lista de provas, testes</text></g>
<line class="ln" x1="190" y1="316" x2="190" y2="334" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="336" width="300" height="47" rx="4"/><text class="h" x="190" y="357" text-anchor="middle">build-review da parte</text><text class="s" x="190" y="375" text-anchor="middle">reprovou: conserta, até 2 rodadas</text></g>
<line class="ln" x1="190" y1="383" x2="190" y2="401" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="403" width="300" height="47" rx="4"/><text class="h" x="190" y="424" text-anchor="middle">sobe na PR rascunho</text><text class="s" x="190" y="442" text-anchor="middle">com bilhete na issue, sem perguntar</text></g>
<path class="bk" d="M340 426 H362 V284 H342" marker-end="url(#b)"/>
<text class="lb" x="370" y="350"><tspan x="370" dy="0">próxima parte</tspan></text>
<text class="lb" x="370" y="394"><tspan x="370" dy="0">para e chama você:</tspan><tspan x="370" dy="15">parte só sua, 2 consertos</tspan><tspan x="370" dy="15">falhos ou decisão fora</tspan><tspan x="370" dy="15">do plano</tspan></text>
<line class="ln" x1="190" y1="470" x2="190" y2="492" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="494" width="300" height="47" rx="4"/><text class="h" x="190" y="515" text-anchor="middle">revisão final do plano</text><text class="s" x="190" y="533" text-anchor="middle">reprovou: volta a quem fez, até 2</text></g>
<line class="ln" x1="190" y1="541" x2="190" y2="563" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="565" width="300" height="47" rx="4"/><text class="h" x="190" y="586" text-anchor="middle">PR sai do rascunho</text><text class="s" x="190" y="604" text-anchor="middle">pronta pra você olhar</text></g>
<line class="ln" x1="190" y1="612" x2="190" y2="634" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="636" width="300" height="47" rx="4"/><text class="h" x="190" y="657" text-anchor="middle">Merge?</text><text class="s" x="190" y="675" text-anchor="middle">sempre seu</text></g>
<line x1="16" y1="700" x2="504" y2="700" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="709" width="14" height="12" rx="2"/></g>
<text x="44" y="719">em verde: ela para e espera você</text>
<line class="bk" x1="252" y1="715" x2="274" y2="715"/>
<text x="280" y="719">tracejado: volta ou atalho</text>
</svg>
