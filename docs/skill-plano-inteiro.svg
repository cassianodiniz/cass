<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 956" width="600" height="956" role="img" aria-labelledby="t d">
<title id="t">uma feature inteira · uma PR</title>
<desc id="d">O planejamento aprovado cria uma branch, uma issue e uma PR em rascunho. implementar executa as tarefas em sequência com commits locais. Cada push depende de autorização. Após a última tarefa, build-review inicia automaticamente. Correções são aprovadas item a item e voltam a implementar por até três rodadas. Com tudo aprovado, um sim permite commit da validação e aprendizados, push e PR pronta. Merge continua com o usuário.</desc>
<style>svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--ns:#d1d9e0}
@media(prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#a6b0bb;--ln:#9198a1;--ns:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--mu);font-size:13px}
.h{font-size:16px;font-weight:600;fill:var(--tx)}
.small{font-size:12px}.title{font-size:18px;font-weight:700;fill:var(--tx)}
.nb rect{fill:transparent;stroke:var(--ns);stroke-width:1.2}
.hot rect{fill:#0f6e56;stroke:#0f6e56;stroke-width:1.2}.hot text{fill:#fff}
.ln{fill:none;stroke:var(--ln);stroke-width:1.4}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9"/></marker></defs>
<text class="title" x="300" y="30" text-anchor="middle">uma feature inteira · uma PR</text>
<g class="hot"><rect x="55" y="60" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="85" text-anchor="middle">Planejar e aprovar</text>
<text class="" x="300.0" y="107" text-anchor="middle">spec-plan dimensiona a feature e seus documentos.</text>
<text class="" x="300.0" y="126" text-anchor="middle">Você aprova cada documento apresentado.</text>
</g>
<path class="ln" d="M300 140 V164" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="168" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="193" text-anchor="middle">Último sim: publicar e começar</text>
<text class="" x="300.0" y="215" text-anchor="middle">Pasta em .specs/; uma branch, uma issue, uma PR rascunho.</text>
<text class="" x="300.0" y="234" text-anchor="middle">implementar começa depois da publicação.</text>
</g>
<path class="ln" d="M300 248 V272" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="276" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="301" text-anchor="middle">Construir em sequência</text>
<text class="" x="300.0" y="323" text-anchor="middle">Tarefa → teste → código → checagem → commit.</text>
<text class="" x="300.0" y="342" text-anchor="middle">Repete sem um novo sim por tarefa.</text>
</g>
<path class="ln" d="M300 356 V380" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="384" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="409" text-anchor="middle">Cada push: pedir autorização</text>
<text class="" x="300.0" y="431" text-anchor="middle">Commit local não é envio ao GitHub.</text>
<text class="" x="300.0" y="450" text-anchor="middle">Uma pausa salva o contexto e faz commit, sem stash.</text>
</g>
<path class="ln" d="M300 464 V488" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="492" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="517" text-anchor="middle">Fim da construção: revisar</text>
<text class="" x="300.0" y="539" text-anchor="middle">build-review começa sozinha e revisa a feature inteira.</text>
<text class="" x="300.0" y="558" text-anchor="middle">Critérios, código, testes e telas quando aplicáveis.</text>
</g>
<path class="ln" d="M300 572 V596" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="600" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="625" text-anchor="middle">Se houver problemas: aprovar correções</text>
<text class="" x="300.0" y="647" text-anchor="middle">Um plano, item por item; implementar corrige.</text>
<text class="" x="300.0" y="666" text-anchor="middle">Nova revisão após cada rodada; limite de três.</text>
</g>
<path class="ln" d="M300 680 V704" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="708" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="733" text-anchor="middle">Sem pendências: autorizar entrega</text>
<text class="" x="300.0" y="755" text-anchor="middle">Commit da validação e aprendizados + push + PR pronta.</text>
<text class="" x="300.0" y="774" text-anchor="middle">Esse sim cobre as três ações.</text>
</g>
<path class="ln" d="M300 788 V812" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="816" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="841" text-anchor="middle">Merge</text>
<text class="" x="300.0" y="863" text-anchor="middle">Você decide quando integrar a feature.</text>
<text class="" x="300.0" y="882" text-anchor="middle">A issue fecha com o merge.</text>
</g>
<text class="small" x="300" y="936" text-anchor="middle">Verde: sua decisão. Setas: sequência do trabalho.</text>
</svg>
