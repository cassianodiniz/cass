<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 945" width="760" height="945" role="img" aria-labelledby="t d">
<title id="t">implementar e gpt-implementar, lado a lado</title>
<desc id="d">As duas construtoras começam iguais: seu sim pra tarefa, pasta limpa com marco de início e a lista de provas escrita pelo agente coordenador antes do código. Na implementar, o agente da conversa constrói com teste antes do código, anota decisões novas, faz commits e não há fiscal no meio. Na gpt-implementar, o Claude escreve a ordem de serviço, subagentes GPT constroem no Codex, o Claude roda as provas e commita, sem fiscal no meio; se uma prova fica vermelha, volta ao Codex até 2 vezes e depois para e pergunta. As duas terminam no relatório final e oferecem a vistoria com o seu sim.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="210" y="20" width="340" height="34" rx="17"/><text class="h" x="380" y="42" text-anchor="middle">uma tarefa aprovada da spec-plan</text>
<line class="ln" x1="380" y1="54" x2="380" y2="76" marker-end="url(#a)"/>
<g class="hot"><rect x="170" y="78" width="420" height="47" rx="4"/><text class="h" x="380" y="99" text-anchor="middle">Qual tarefa? Posso começar?</text><text class="s" x="380" y="117" text-anchor="middle">cada tarefa começa no seu sim</text></g>
<line class="ln" x1="380" y1="125" x2="380" y2="147" marker-end="url(#a)"/>
<g class="nb"><rect x="170" y="149" width="420" height="47" rx="4"/><text class="h" x="380" y="170" text-anchor="middle">pasta limpa e marco de início</text><text class="s" x="380" y="188" text-anchor="middle">trabalho solto de outra frente: para e pergunta</text></g>
<line class="ln" x1="380" y1="196" x2="380" y2="218" marker-end="url(#a)"/>
<g class="nb"><rect x="170" y="220" width="420" height="64" rx="4"/><text class="h" x="380" y="241" text-anchor="middle">lista de provas (.checks)</text><text class="s" x="380" y="259" text-anchor="middle">o agente escreve antes do código:</text><text class="s" x="380" y="276" text-anchor="middle">cada item com o teste que o prova</text></g>
<path class="ln" d="M380 284 V302 M190 302 H570"/>
<rect class="pill" x="110" y="308" width="160" height="22" rx="4"/><text class="cap" x="190" y="323" text-anchor="middle">/cass:implementar</text>
<rect class="pill" x="474" y="308" width="192" height="22" rx="4"/><text class="cap" x="570" y="323" text-anchor="middle">/cass:gpt-implementar</text>
<line class="ln" x1="190" y1="302" x2="190" y2="308"/><line class="ln" x1="570" y1="302" x2="570" y2="308"/>
<line class="ln" x1="190" y1="330" x2="190" y2="340" marker-end="url(#a)"/>
<line class="ln" x1="570" y1="330" x2="570" y2="340" marker-end="url(#a)"/>
<g class="nb"><rect x="30" y="342" width="320" height="47" rx="4"/><text class="h" x="190" y="363" text-anchor="middle">o agente da conversa constrói</text><text class="s" x="190" y="381" text-anchor="middle">Claude, Codex, Grok ou outro</text></g>
<line class="ln" x1="190" y1="389" x2="190" y2="411" marker-end="url(#a)"/>
<g class="nb"><rect x="30" y="413" width="320" height="47" rx="4"/><text class="h" x="190" y="434" text-anchor="middle">teste falha, código, teste passa</text><text class="s" x="190" y="452" text-anchor="middle">um item da lista por vez</text></g>
<line class="ln" x1="190" y1="460" x2="190" y2="482" marker-end="url(#a)"/>
<g class="nb"><rect x="30" y="484" width="320" height="47" rx="4"/><text class="h" x="190" y="505" text-anchor="middle">decisão nova anotada antes do código</text><text class="s" x="190" y="523" text-anchor="middle">com a alternativa que ficou de fora</text></g>
<line class="ln" x1="190" y1="531" x2="190" y2="553" marker-end="url(#a)"/>
<g class="nb"><rect x="30" y="555" width="320" height="47" rx="4"/><text class="h" x="190" y="576" text-anchor="middle">commits conforme avança</text><text class="s" x="190" y="594" text-anchor="middle">o próprio agente salva cada pedaço</text></g>
<line class="ln" x1="190" y1="602" x2="190" y2="624" marker-end="url(#a)"/>
<g class="gh"><rect x="30" y="626" width="320" height="47" rx="4"/><text class="h" x="190" y="647" text-anchor="middle">sem fiscal no meio</text><text class="s" x="190" y="665" text-anchor="middle">a conferência fica pra vistoria</text></g>
<g class="nb"><rect x="410" y="342" width="320" height="47" rx="4"/><text class="h" x="570" y="363" text-anchor="middle">o Claude escreve a ordem de serviço</text><text class="s" x="570" y="381" text-anchor="middle">objetivo, limites e as provas</text></g>
<line class="ln" x1="570" y1="389" x2="570" y2="411" marker-end="url(#a)"/>
<g class="ac"><rect x="410" y="413" width="320" height="47" rx="4"/><text class="h" x="570" y="434" text-anchor="middle">subagentes GPT constroem no Codex</text><text class="s" x="570" y="452" text-anchor="middle">mesmas regras: teste antes do código</text></g>
<line class="ln" x1="570" y1="460" x2="570" y2="482" marker-end="url(#a)"/>
<g class="nb"><rect x="410" y="484" width="320" height="47" rx="4"/><text class="h" x="570" y="505" text-anchor="middle">o Claude roda as provas e commita</text><text class="s" x="570" y="523" text-anchor="middle">o relato do Codex não conta como prova</text></g>
<line class="ln" x1="570" y1="531" x2="570" y2="553" marker-end="url(#a)"/>
<g class="gh"><rect x="410" y="555" width="320" height="47" rx="4"/><text class="h" x="570" y="576" text-anchor="middle">sem fiscal no meio</text><text class="s" x="570" y="594" text-anchor="middle">a conferência fica pra vistoria</text></g>
<path class="bk" d="M730 507 H746 V436 H732" marker-end="url(#b)"/>
<text class="lb" x="570" y="622" text-anchor="middle"><tspan x="570" dy="0">prova vermelha: volta ao Codex, até 2 vezes;</tspan><tspan x="570" dy="15">depois para e pergunta a você</tspan></text>
<path class="ln" d="M190 673 V691 M570 646 V691 M190 691 H570"/>
<line class="ln" x1="380" y1="691" x2="380" y2="711" marker-end="url(#a)"/>
<g class="nb"><rect x="170" y="713" width="420" height="47" rx="4"/><text class="h" x="380" y="734" text-anchor="middle">relatório final</text><text class="s" x="380" y="752" text-anchor="middle">o que foi feito, as provas e o que falta</text></g>
<line class="ln" x1="380" y1="760" x2="380" y2="782" marker-end="url(#a)"/>
<g class="hot"><rect x="170" y="784" width="420" height="47" rx="4"/><text class="h" x="380" y="805" text-anchor="middle">Posso rodar a vistoria?</text><text class="s" x="380" y="823" text-anchor="middle">build-review; push e PR só com o seu OK</text></g>
<line class="ln" x1="380" y1="831" x2="380" y2="853" marker-end="url(#a)"/>
<rect class="pill" x="280" y="855" width="200" height="34" rx="17"/><text class="h" x="380" y="877" text-anchor="middle">build-review</text>
