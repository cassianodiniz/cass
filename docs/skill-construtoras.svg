<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 868" width="600" height="868" role="img" aria-labelledby="t d">
<title id="t">implementar · uma tarefa por vez</title>
<desc id="d">Lê a feature aprovada na branch e as regras do projeto. Sem tarefas formais lista passos; mais de cinco passos ou dependências complexas voltam a spec-plan. Define ferramentas, oferece subagentes para mais de um lote e espera a escolha. Executa tarefa, teste, código, verificação e commit em sequência. Push pede autorização. A última tarefa inicia build-review automaticamente.</desc>
<style>svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--ns:#d1d9e0}
@media(prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#a6b0bb;--ln:#9198a1;--ns:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--mu);font-size:13px}
.h{font-size:16px;font-weight:600;fill:var(--tx)}
.small{font-size:12px}.title{font-size:18px;font-weight:700;fill:var(--tx)}
.nb rect{fill:transparent;stroke:var(--ns);stroke-width:1.2}
.hot rect{fill:#0f6e56;stroke:#0f6e56;stroke-width:1.2}.hot text{fill:#fff}
.ln{fill:none;stroke:var(--ln);stroke-width:1.4}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9"/></marker></defs>
<text class="title" x="300" y="30" text-anchor="middle">implementar · uma tarefa por vez</text>
<g class="nb"><rect x="55" y="60" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="85" text-anchor="middle">Ler a feature aprovada</text>
<text class="" x="300.0" y="107" text-anchor="middle">.specs/features/&lt;feature&gt;/ na branch da feature.</text>
<text class="" x="300.0" y="126" text-anchor="middle">Spec, tarefas quando existem, regras e glossário.</text>
</g>
<path class="ln" d="M300 140 V164" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="168" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="193" text-anchor="middle">Preparar a execução</text>
<text class="" x="300.0" y="215" text-anchor="middle">Sem tasks.md, lista passos; se crescer, volta ao plano.</text>
<text class="" x="300.0" y="234" text-anchor="middle">Mais de um lote? Oferece subagentes e espera.</text>
</g>
<path class="ln" d="M300 248 V272" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="276" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="301" text-anchor="middle">Definir as ferramentas</text>
<text class="" x="300.0" y="323" text-anchor="middle">A escolha fica registrada em cada tarefa ou passo.</text>
<text class="" x="300.0" y="342" text-anchor="middle">Feita antes da primeira tarefa.</text>
</g>
<path class="ln" d="M300 356 V380" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="384" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="409" text-anchor="middle">Construir uma tarefa</text>
<text class="" x="300.0" y="431" text-anchor="middle">Teste do resultado pedido: falha → código → passa.</text>
<text class="" x="300.0" y="450" text-anchor="middle">Uma tarefa por vez; nunca em paralelo.</text>
</g>
<path class="ln" d="M300 464 V488" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="492" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="517" text-anchor="middle">Conferir e commitar</text>
<text class="" x="300.0" y="539" text-anchor="middle">A checagem deve passar; marca a tarefa concluída.</text>
<text class="" x="300.0" y="558" text-anchor="middle">Um commit por tarefa; segue para a próxima.</text>
</g>
<path class="ln" d="M300 572 V596" marker-end="url(#a)"/>
<g class="hot"><rect x="55" y="600" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="625" text-anchor="middle">Enviar ao GitHub?</text>
<text class="" x="300.0" y="647" text-anchor="middle">Cada push precisa da sua autorização.</text>
<text class="" x="300.0" y="666" text-anchor="middle">Bloqueio, teste errado ou bug fora do pedido: pergunta.</text>
</g>
<path class="ln" d="M300 680 V704" marker-end="url(#a)"/>
<g class="nb"><rect x="55" y="708" width="490" height="80" rx="6"/>
<text class="h" x="300.0" y="733" text-anchor="middle">Última tarefa: build-review</text>
<text class="" x="300.0" y="755" text-anchor="middle">Inicia a revisão completa automaticamente.</text>
<text class="" x="300.0" y="774" text-anchor="middle">As correções aprovadas usam o mesmo ciclo.</text>
</g>
<text class="small" x="300" y="824" text-anchor="middle">gpt-implementar mantém o contrato anterior; requer adaptação.</text>
<text class="small" x="300" y="848" text-anchor="middle">Verde: sua decisão. Setas: sequência do trabalho.</text>
</svg>
