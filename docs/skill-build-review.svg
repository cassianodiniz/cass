<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 658" width="600" height="658" role="img" aria-labelledby="t d">
<title id="t">Como a build-review funciona</title>
<desc id="d">A build-review reúne o marco de início, o pedido original, a lista de provas e as regras do projeto; sem lista de provas, para. Três revisores trabalham em paralelo sem conversar: Standards confere as regras do projeto, Spec confere se fez o que foi pedido e o Fiscal prova cada item, inclusive estragando o código de propósito. Os relatórios vão inteiros pra um arquivo e sai o veredito. Aprovado: pergunta se pode subir e abrir a PR. Reprovado: pergunta se devolve a quem construiu pra uma rodada de conserto.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="135" y="20" width="330" height="34" rx="17"/><text class="h" x="300" y="42" text-anchor="middle">obra pronta: lista de provas, pedido e diff</text>
<line class="ln" x1="300" y1="54" x2="300" y2="76" marker-end="url(#a)"/>
<g class="nb"><rect x="120" y="78" width="360" height="64" rx="4"/><text class="h" x="300" y="99" text-anchor="middle">reúne as entradas</text><text class="s" x="300" y="117" text-anchor="middle">marco de início, pedido original, lista de provas</text><text class="s" x="300" y="134" text-anchor="middle">e regras do projeto; sem lista de provas, para</text></g>
<path class="ln" d="M300 142 V156 M108 156 H492"/>
<line class="ln" x1="108" y1="156" x2="108" y2="184" marker-end="url(#a)"/>
<line class="ln" x1="300" y1="156" x2="300" y2="184" marker-end="url(#a)"/>
<line class="ln" x1="492" y1="156" x2="492" y2="184" marker-end="url(#a)"/>
<text class="s" x="204" y="175" text-anchor="middle"><tspan x="204" dy="0">três revisores</tspan></text>
<text class="s" x="396" y="175" text-anchor="middle"><tspan x="396" dy="0">sem conversar entre si</tspan></text>
<g class="nb"><rect x="24" y="186" width="168" height="64" rx="4"/><text class="h" x="108" y="207" text-anchor="middle">Standards</text><text class="s" x="108" y="225" text-anchor="middle">segue as regras</text><text class="s" x="108" y="242" text-anchor="middle">do projeto?</text></g>
<g class="nb"><rect x="216" y="186" width="168" height="64" rx="4"/><text class="h" x="300" y="207" text-anchor="middle">Spec</text><text class="s" x="300" y="225" text-anchor="middle">fez o que foi</text><text class="s" x="300" y="242" text-anchor="middle">pedido?</text></g>
<g class="ac"><rect x="408" y="186" width="168" height="81" rx="4"/><text class="h" x="492" y="207" text-anchor="middle">Fiscal</text><text class="s" x="492" y="225" text-anchor="middle">prova cada item;</text><text class="s" x="492" y="242" text-anchor="middle">estraga o código de</text><text class="s" x="492" y="259" text-anchor="middle">propósito pra testar</text></g>
<path class="ln" d="M108 250 V283 M300 250 V283 M492 267 V283 M108 283 H492"/>
<line class="ln" x1="300" y1="283" x2="300" y2="303" marker-end="url(#a)"/>
<g class="nb"><rect x="120" y="305" width="360" height="47" rx="4"/><text class="h" x="300" y="326" text-anchor="middle">junta sem misturar</text><text class="s" x="300" y="344" text-anchor="middle">os três relatórios inteiros em .checks/…review.md</text></g>
<line class="ln" x1="300" y1="352" x2="300" y2="374" marker-end="url(#a)"/>
<g class="nb"><rect x="120" y="376" width="360" height="64" rx="4"/><text class="h" x="300" y="397" text-anchor="middle">veredito</text><text class="s" x="300" y="415" text-anchor="middle">reprova se o Fiscal reprova ou se outro</text><text class="s" x="300" y="432" text-anchor="middle">revisor demonstra um defeito</text></g>
<path class="ln" d="M300 440 V456 M150 456 H450"/>
<path class="ln" d="M150 456 V478" marker-end="url(#a)"/>
<path class="ln" d="M450 456 V478" marker-end="url(#a)"/>
<text class="s" x="158" y="472" text-anchor="start"><tspan x="158" dy="0">aprovado</tspan></text>
<text class="s" x="442" y="472" text-anchor="end"><tspan x="442" dy="0">reprovado</tspan></text>
<g class="hot"><rect x="30" y="480" width="240" height="47" rx="4"/><text class="h" x="150" y="501" text-anchor="middle">Posso subir e abrir a PR?</text><text class="s" x="150" y="519" text-anchor="middle">push e PR só com o seu OK</text></g>
<g class="hot"><rect x="330" y="480" width="240" height="64" rx="4"/><text class="h" x="450" y="501" text-anchor="middle">Devolvo a quem construiu?</text><text class="s" x="450" y="519" text-anchor="middle">uma rodada de conserto;</text><text class="s" x="450" y="536" text-anchor="middle">reprovou de novo: para e pergunta</text></g>
<line class="ln" x1="150" y1="527" x2="150" y2="566" marker-end="url(#a)"/>
<line class="ln" x1="450" y1="544" x2="450" y2="566" marker-end="url(#a)"/>
<rect class="pill" x="50" y="568" width="200" height="34" rx="17"/><text class="h" x="150" y="590" text-anchor="middle">PR no GitHub</text>
<rect class="pill" x="325" y="568" width="250" height="34" rx="17"/><text class="h" x="450" y="590" text-anchor="middle">implementar ou gpt-implementar</text>
<line x1="16" y1="618" x2="584" y2="618" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="627" width="14" height="12" rx="2"/></g>
<text x="44" y="637">em verde: ela para e espera você</text>
</svg>
