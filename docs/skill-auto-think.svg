<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 709" width="520" height="709" role="img" aria-labelledby="t d">
<title id="t">Como a auto-think funciona</title>
<desc id="d">A auto-think confirma o alvo com você e, daí em diante, não interrompe: enquadra o problema, estuda por vários ângulos, manda o GPT tentar derrubar as candidatas, passa cada uma por um portão de 4 perguntas e cava de novo só o que muda a decisão. O GPT confronta os finalistas numa segunda rodada e ela entrega a recomendada e as alternativas, sem executar nada.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="18" y="20" width="344" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">um problema difícil, sem resposta pronta</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="78" width="300" height="47" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">Entendi assim. É isso?</text><text class="s" x="190" y="117" text-anchor="middle">reescreve o pedido e espera o seu &quot;isso&quot;</text></g>
<line class="ln" x1="190" y1="125" x2="190" y2="147" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="149" width="300" height="64" rx="4"/><text class="h" x="190" y="170" text-anchor="middle">enquadra o problema</text><text class="s" x="190" y="188" text-anchor="middle">fato × suposição, o que conta como resolvido;</text><text class="s" x="190" y="205" text-anchor="middle">daqui em diante, não interrompe você</text></g>
<line class="ln" x1="190" y1="213" x2="190" y2="235" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="237" width="300" height="64" rx="4"/><text class="h" x="190" y="258" text-anchor="middle">estuda por vários ângulos</text><text class="s" x="190" y="276" text-anchor="middle">search, documentação oficial e o projeto;</text><text class="s" x="190" y="293" text-anchor="middle">dados pessoais viram etiquetas antes de sair</text></g>
<line class="ln" x1="190" y1="301" x2="190" y2="323" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="325" width="300" height="47" rx="4"/><text class="h" x="190" y="346" text-anchor="middle">rodada 1: o GPT tenta derrubar</text><text class="s" x="190" y="364" text-anchor="middle">todas as candidatas de uma vez</text></g>
<line class="ln" x1="190" y1="372" x2="190" y2="394" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="396" width="300" height="64" rx="4"/><text class="h" x="190" y="417" text-anchor="middle">portão de qualidade</text><text class="s" x="190" y="435" text-anchor="middle">achei a resposta? funciona mesmo?</text><text class="s" x="190" y="452" text-anchor="middle">tem algo melhor? como evito lixo?</text></g>
<line class="ln" x1="190" y1="460" x2="190" y2="482" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="484" width="300" height="47" rx="4"/><text class="h" x="190" y="505" text-anchor="middle">cava só o que muda a decisão</text><text class="s" x="190" y="523" text-anchor="middle">no máximo 3 dúvidas abertas por vez</text></g>
<line class="ln" x1="190" y1="531" x2="190" y2="553" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="555" width="300" height="34" rx="4"/><text class="h" x="190" y="577" text-anchor="middle">rodada 2: o GPT confronta os finalistas</text></g>
<line class="ln" x1="190" y1="589" x2="190" y2="611" marker-end="url(#a)"/>
<rect class="pill" x="-1" y="613" width="382" height="34" rx="17"/><text class="h" x="190" y="635" text-anchor="middle">a recomendada e as alternativas, com o porquê</text>
<path class="bk" d="M340 507 H362 V428 H342" marker-end="url(#b)"/>
<text class="lb" x="370" y="453" text-anchor="start"><tspan x="370" dy="0">ainda há dúvida</tspan><tspan x="370" dy="15">que muda a</tspan><tspan x="370" dy="15">decisão</tspan></text>
<line x1="16" y1="669" x2="504" y2="669" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="678" width="14" height="12" rx="2"/></g>
<text x="44" y="688">em verde: ela para e espera você</text>
<line class="bk" x1="252" y1="684" x2="274" y2="684"/>
<text x="280" y="688">tracejado: volta ou atalho</text>
</svg>
