<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 722" width="520" height="722" role="img" aria-labelledby="t d">
<title id="t">Como a ask-me funciona</title>
<desc id="d">A ask-me busca os fatos sozinha, faz rodadas de até 4 perguntas com a resposta recomendada, espera você responder e confere cada resposta com os limites que você já deu; enquanto houver decisão em aberto, faz nova rodada. Depois pergunta se fechamos, entrega o pedido pronto pra colar e pergunta se executa ali ou leva pra spec-plan.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1.2}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ac rect{fill:var(--nf);stroke:var(--ln);stroke-width:2}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.cap{font-size:13px;font-weight:600;fill:var(--tx);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="86.5" y="20" width="207" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">você descreve a tarefa</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="78" width="300" height="47" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">busca os fatos sozinha</text><text class="s" x="190" y="117" text-anchor="middle">no projeto, nos arquivos e nas ferramentas</text></g>
<line class="ln" x1="190" y1="125" x2="190" y2="147" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="149" width="300" height="47" rx="4"/><text class="h" x="190" y="170" text-anchor="middle">rodada de até 4 perguntas</text><text class="s" x="190" y="188" text-anchor="middle">cada uma com a resposta que ela recomenda</text></g>
<line class="ln" x1="190" y1="196" x2="190" y2="218" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="220" width="300" height="47" rx="4"/><text class="h" x="190" y="241" text-anchor="middle">você responde</text><text class="s" x="190" y="259" text-anchor="middle">curto (&quot;1a 2c&quot;) ou com suas palavras</text></g>
<line class="ln" x1="190" y1="267" x2="190" y2="289" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="291" width="300" height="64" rx="4"/><text class="h" x="190" y="312" text-anchor="middle">confere com os limites que você deu</text><text class="s" x="190" y="330" text-anchor="middle">resposta nova bateu num limite antigo?</text><text class="s" x="190" y="347" text-anchor="middle">vira pergunta de conflito na rodada seguinte</text></g>
<line class="ln" x1="190" y1="355" x2="190" y2="377" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="379" width="300" height="47" rx="4"/><text class="h" x="190" y="400" text-anchor="middle">Fechamos?</text><text class="s" x="190" y="418" text-anchor="middle">se você ajustar algo, a entrevista reabre</text></g>
<line class="ln" x1="190" y1="426" x2="190" y2="448" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="450" width="300" height="64" rx="4"/><text class="h" x="190" y="471" text-anchor="middle">o pedido pronto pra colar</text><text class="s" x="190" y="489" text-anchor="middle">Objetivo · Pronto quando · Fazer</text><text class="s" x="190" y="506" text-anchor="middle">NÃO fazer · Parar e perguntar</text></g>
<line class="ln" x1="190" y1="514" x2="190" y2="536" marker-end="url(#a)"/>
<g class="hot"><rect x="40" y="538" width="300" height="64" rx="4"/><text class="h" x="190" y="559" text-anchor="middle">Executo aqui agora?</text><text class="s" x="190" y="577" text-anchor="middle">várias funcionalidades num pedido de código:</text><text class="s" x="190" y="594" text-anchor="middle">oferece levar pra spec-plan</text></g>
<line class="ln" x1="190" y1="602" x2="190" y2="624" marker-end="url(#a)"/>
<rect class="pill" x="64" y="626" width="252" height="34" rx="17"/><text class="h" x="190" y="648" text-anchor="middle">executa só depois do seu sim</text>
<path class="bk" d="M340 323 H362 V172 H342" marker-end="url(#b)"/>
<text class="lb" x="370" y="233" text-anchor="start"><tspan x="370" dy="0">ainda há decisão</tspan><tspan x="370" dy="15">em aberto: nova</tspan><tspan x="370" dy="15">rodada</tspan></text>
<line x1="16" y1="682" x2="504" y2="682" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="hot"><rect x="24" y="691" width="14" height="12" rx="2"/></g>
<text x="44" y="701">em verde: ela para e espera você</text>
<line class="bk" x1="252" y1="697" x2="274" y2="697"/>
<text x="280" y="701">tracejado: volta ou atalho</text>
</svg>
