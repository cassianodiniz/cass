<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1480" viewBox="0 0 1300 1480" role="img" aria-labelledby="title desc">
<title id="title">Fluxo principal de implementação do cass</title>
<desc id="desc">As três entradas convergem para spec-plan, detalhada em entender, documentar e aprovar. GPT-implementar ocupa o caminho principal. Lateralmente, um agente GPT Sol recebe cada lote, executa testes, código e commits e devolve provas ao Claude. Lotes sequenciais; até duas correções no mesmo GPT. Build-review mostra Verifier, Standards e Spec, capturas e teste guiado quando aplicáveis, com correções aprovadas voltando à construção e revisão, até três rodadas. A entrega pede autorização. Aprender-com-a-sessao entra quando chamada pelo usuário, registra sugestões e aplica apenas as escolhidas.</desc>
<style>
svg{--tx:#e6edf3;--mu:#a6b0bb;--line:#9198a1;--border:#3d444d}
@media(prefers-color-scheme:light){svg{--tx:#1f2328;--mu:#59636e;--line:#59636e;--border:#d1d9e0}}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--mu);font-size:16px}
.title{font-size:26px;font-weight:700;fill:var(--tx)}
.h{font-size:20px;font-weight:700;fill:var(--tx)}
.sh{font-size:16px;font-weight:700;fill:var(--tx)}
.small{font-size:14px}.tiny{font-size:13px}
.box{fill:transparent;stroke:var(--border);stroke-width:1.5}
.green{fill:#0f6e56;stroke:#0f6e56}.white{fill:#fff}
.line{fill:none;stroke:var(--line);stroke-width:1.6}
.dash{stroke-dasharray:6 5}.accent{stroke:#32a78b}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="line" d="M2 1L8 5L2 9" /></marker></defs>
<text x="450" y="42" text-anchor="middle" class="title">Qual é a sua situação?</text>
<rect x="40" y="78" width="245" height="80" rx="7" class="box" />
<text x="162.5" y="105" text-anchor="middle" class="sh">Mudança a esclarecer</text>
<text x="162.5" y="128" text-anchor="middle" class="small ">spec-plan</text>
<rect x="300" y="78" width="245" height="80" rx="7" class="box" />
<text x="422.5" y="105" text-anchor="middle" class="sh">Pesquisar ideias</text>
<text x="422.5" y="128" text-anchor="middle" class="small ">ask-me → search</text>
<rect x="560" y="78" width="245" height="80" rx="7" class="box" />
<text x="682.5" y="105" text-anchor="middle" class="sh">Problema sem resposta</text>
<text x="682.5" y="128" text-anchor="middle" class="small ">ask-me → auto-think</text>
<path d="M162 158 V188 H682 V158" class="line" />
<path d="M422 158 V214" class="line" marker-end="url(#arrow)" />
<rect x="100" y="220" width="650" height="262" rx="7" class="box" />
<rect x="100" y="220" width="650" height="48" rx="7" class="green" />
<text x="425" y="251" text-anchor="middle" class="h white" style="fill:#ffffff">spec-plan</text>
<text x="127" y="300" text-anchor="start" class="sh">1</text>
<text x="154" y="300" text-anchor="start" class="sh">Entender o pedido</text>
<text x="154" y="323" text-anchor="start" class="small">Perguntas, limites e requisitos que não podem ficar esquecidos.</text>
<path d="M121 339 H729" class="line" />
<text x="127" y="365" text-anchor="start" class="sh">2</text>
<text x="154" y="365" text-anchor="start" class="sh">Escrever os documentos na medida da feature</text>
<text x="154" y="388" text-anchor="start" class="small">Spec sempre; contexto, design e tarefas quando necessários.</text>
<path d="M121 404 H729" class="line" />
<rect x="119" y="411" width="612" height="54" rx="7" class="box green" />
<text x="425" y="432" text-anchor="middle" class="sh white" style="fill:#ffffff">Um sim só, no fim</text>
<text x="425" y="454" text-anchor="middle" class="small white" style="fill:#ffffff">O sim abre branch + issue + PR rascunho.</text>
<path d="M425 482 V562" class="line" marker-end="url(#arrow)" />
<text x="410" y="525" text-anchor="end" class="small">“sim, codex” inicia a construção</text>
<rect x="165" y="569" width="520" height="104" rx="7" class="box" />
<text x="425.0" y="596" text-anchor="middle" class="h">gpt-implementar</text>
<text x="425.0" y="619" text-anchor="middle" class="">Claude coordena; o Codex constrói os lotes.</text>
<text x="425.0" y="641" text-anchor="middle" class="">Uma tarefa por vez, checagem e commit.</text>
<text x="1005" y="599" text-anchor="middle" class="sh">Por dentro da gpt-implementar</text>
<rect x="850" y="617" width="310" height="79" rx="7" class="box" />
<text x="1005.0" y="644" text-anchor="middle" class="sh">GPT-6.1-sol · lote atual</text>
<text x="1005.0" y="667" text-anchor="middle" class="small ">Teste → código → checagem → commit.</text>
<text x="1005.0" y="689" text-anchor="middle" class="small ">Devolve resumo e evidências.</text>
<path d="M685 640 H844" class="line" marker-end="url(#arrow)" />
<text x="767" y="625" text-anchor="middle" class="tiny">Envia lote</text>
<path d="M1005 696 V723" class="line" marker-end="url(#arrow)" />
<rect x="850" y="730" width="310" height="63" rx="7" class="box" />
<text x="1005.0" y="757" text-anchor="middle" class="sh">Claude confere</text>
<text x="1005.0" y="780" text-anchor="middle" class="small ">Git e provas de cada tarefa.</text>
<path d="M850 762 H785 V663 H691" class="line" marker-end="url(#arrow)" />
<text x="776" y="709" text-anchor="end" class="tiny">Conferido:</text>
<text x="776" y="729" text-anchor="end" class="tiny">próximo lote</text>
<path d="M1160 762 H1205 V656 H1166" class="line dash" marker-end="url(#arrow)" />
<text x="1005" y="824" text-anchor="middle" class="small">Conserto no mesmo GPT: até 2 rodadas.</text>
<text x="1005" y="847" text-anchor="middle" class="small">Um lote por vez; só depois começa o próximo.</text>
<path d="M425 673 V819" class="line" marker-end="url(#arrow)" />
<text x="410" y="747" text-anchor="end" class="small">Todos os lotes conferidos</text>
<rect x="100" y="826" width="650" height="284" rx="7" class="box" />
<text x="425" y="858" text-anchor="middle" class="h">build-review</text>
<text x="425" y="883" text-anchor="middle" class="small">Automática depois da última tarefa.</text>
<rect x="119" y="902" width="196" height="79" rx="7" class="box" />
<text x="217.0" y="929" text-anchor="middle" class="sh">Verifier</text>
<text x="217.0" y="952" text-anchor="middle" class="small ">Critérios e testes que</text>
<text x="217.0" y="974" text-anchor="middle" class="small ">detectam defeitos.</text>
<rect x="327" y="902" width="196" height="79" rx="7" class="box" />
<text x="425.0" y="929" text-anchor="middle" class="sh">Standards</text>
<text x="425.0" y="952" text-anchor="middle" class="small ">Regras e padrões</text>
<text x="425.0" y="974" text-anchor="middle" class="small ">do projeto.</text>
<rect x="535" y="902" width="196" height="79" rx="7" class="box" />
<text x="633.0" y="929" text-anchor="middle" class="sh">Spec</text>
<text x="633.0" y="952" text-anchor="middle" class="small ">O que foi construído</text>
<text x="633.0" y="974" text-anchor="middle" class="small ">cumpre o pedido?</text>
<text x="425" y="1008" text-anchor="middle" class="small">Testes verdes → telas → teste guiado, quando aplicável.</text>
<text x="425" y="1031" text-anchor="middle" class="small">Verifier dá o veredito; os outros relatos ficam separados.</text>
<rect x="119" y="1049" width="612" height="44" rx="7" class="box green" />
<text x="425" y="1077" text-anchor="middle" class="sh white" style="fill:#ffffff">Você aprova as correções, item por item.</text>
<path d="M750 1072 H814 V588 H691" class="line dash" marker-end="url(#arrow)" />
<text x="832" y="934" text-anchor="start" class="small">Correções aprovadas</text>
<text x="832" y="957" text-anchor="start" class="small">voltam ao Codex</text>
<text x="832" y="980" text-anchor="start" class="small">e passam por nova revisão.</text>
<text x="832" y="1003" text-anchor="start" class="small">Limite: 3 rodadas; depois, chama você.</text>
<path d="M425 1110 V1158" class="line" marker-end="url(#arrow)" />
<text x="410" y="1140" text-anchor="end" class="tiny">PASS e sem correções aprovadas pendentes</text>
<rect x="165" y="1165" width="520" height="104" rx="7" class="box green" />
<text x="425.0" y="1192" text-anchor="middle" class="h white" style="fill:#ffffff">Seu sim para a entrega</text>
<text x="425.0" y="1215" text-anchor="middle" class="white" style="fill:#ffffff">Commit da validação + push + PR pronta.</text>
<text x="425.0" y="1237" text-anchor="middle" class="white" style="fill:#ffffff">Cada push pede autorização; merge é seu.</text>
<path d="M425 1269 V1321" class="line dash" marker-end="url(#arrow)" />
<text x="410" y="1300" text-anchor="end" class="small">Quando você chamar, ao fim da sessão</text>
<rect x="100" y="1328" width="1160" height="132" rx="7" class="box" />
<text x="680" y="1358" text-anchor="middle" class="h">aprender-com-a-sessao</text>
<text x="680" y="1383" text-anchor="middle" class="small">Rever a sessão e sugerir melhorias. Depois de revisar e publicar.</text>
<rect x="126" y="1399" width="220" height="40" rx="7" class="box" />
<text x="236.0" y="1425" text-anchor="middle" class="sh">Rever o caminho</text>
<rect x="397" y="1399" width="260" height="40" rx="7" class="box" />
<text x="527.0" y="1425" text-anchor="middle" class="sh">Guardar sugestões</text>
<rect x="710" y="1399" width="230" height="40" rx="7" class="box green" />
<text x="825.0" y="1425" text-anchor="middle" class="sh white" style="fill:#ffffff">Você escolhe</text>
<path d="M346 1419 H391" class="line" marker-end="url(#arrow)" />
<path d="M657 1419 H704" class="line" marker-end="url(#arrow)" />
<text x="1094" y="1415" text-anchor="middle" class="small">Aplica só as escolhidas.</text>
<text x="1094" y="1437" text-anchor="middle" class="small">As demais ficam pendentes.</text>
<path d="M940 1419 H967" class="line" marker-end="url(#arrow)" />
<text x="1048" y="1120" text-anchor="middle" class="small">Verde: sua decisão.</text>
<text x="1048" y="1144" text-anchor="middle" class="small">Tracejado: correções ou chamada manual.</text>
</svg>