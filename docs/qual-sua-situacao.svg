<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="t d">
<title id="t">Qual skill do cass usar</title>
<desc id="d">Três entradas para planejar uma feature. Fluxo atual: spec-plan publica uma branch, issue e PR rascunho; implementar constrói tarefas em sequência; build-review revisa ao final; correções aprovadas voltam a implementar por até três rodadas. A entrega precisa de autorização para commit, push e PR pronta. gpt-implementar é identificada como contrato anterior que precisa de adaptação. Ferramentas de apoio aparecem ao lado.</desc>
<style>svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--ns:#d1d9e0}
@media(prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#a6b0bb;--ln:#9198a1;--ns:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--mu);font-size:13px}
.h{font-size:16px;font-weight:600;fill:var(--tx)}
.small{font-size:12px}.title{font-size:18px;font-weight:700;fill:var(--tx)}
.nb rect{fill:transparent;stroke:var(--ns);stroke-width:1.2}
.hot rect{fill:#0f6e56;stroke:#0f6e56;stroke-width:1.2}.hot text{fill:#fff}
.ln{fill:none;stroke:var(--ln);stroke-width:1.4}.dash{stroke-dasharray:5 4}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9"/></marker></defs>
<text class="title" x="340" y="32" text-anchor="middle">Qual é a sua situação?</text>
<g class="nb"><rect x="35" y="65" width="190" height="61" rx="6"/>
<text class="h small" x="130.0" y="90" text-anchor="middle">Mudança a esclarecer</text>
<text class="" x="130.0" y="112" text-anchor="middle">spec-plan</text>
</g>
<g class="nb"><rect x="245" y="65" width="190" height="61" rx="6"/>
<text class="h small" x="340.0" y="90" text-anchor="middle">Pesquisar ideias</text>
<text class="" x="340.0" y="112" text-anchor="middle">ask-me → search</text>
</g>
<g class="nb"><rect x="455" y="65" width="190" height="61" rx="6"/>
<text class="h small" x="550.0" y="90" text-anchor="middle">Problema sem resposta</text>
<text class="" x="550.0" y="112" text-anchor="middle">ask-me → auto-think</text>
</g>
<path class="ln" d="M130 126 V165 H550 V126 M340 126 V186" marker-end="url(#a)"/>
<g class="hot"><rect x="125" y="188" width="430" height="80" rx="6"/>
<text class="h" x="340.0" y="213" text-anchor="middle">spec-plan</text>
<text class="" x="340.0" y="235" text-anchor="middle">Aprovar os documentos da feature.</text>
<text class="" x="340.0" y="254" text-anchor="middle">Último sim: branch + issue + PR rascunho.</text>
</g>
<path class="ln" d="M340 268 V299" marker-end="url(#a)"/>
<g class="nb"><rect x="125" y="302" width="430" height="80" rx="6"/>
<text class="h" x="340.0" y="327" text-anchor="middle">implementar</text>
<text class="" x="340.0" y="349" text-anchor="middle">Uma tarefa por vez, checagem e commit.</text>
<text class="" x="340.0" y="368" text-anchor="middle">Começa depois da publicação do plano.</text>
</g>
<path class="ln" d="M340 382 V413" marker-end="url(#a)"/>
<g class="nb"><rect x="125" y="416" width="430" height="80" rx="6"/>
<text class="h" x="340.0" y="441" text-anchor="middle">build-review</text>
<text class="" x="340.0" y="463" text-anchor="middle">Automática depois da última tarefa.</text>
<text class="" x="340.0" y="482" text-anchor="middle">Critérios, testes, código e telas.</text>
</g>
<path class="ln" d="M340 496 V527" marker-end="url(#a)"/>
<g class="hot"><rect x="125" y="530" width="430" height="80" rx="6"/>
<text class="h" x="340.0" y="555" text-anchor="middle">Seu sim para a entrega</text>
<text class="" x="340.0" y="577" text-anchor="middle">Commit da validação + push + PR pronta.</text>
<text class="" x="340.0" y="596" text-anchor="middle">Cada push pede autorização; merge é seu.</text>
</g>
<path class="ln dash" d="M555 450 H658 V340 H558" marker-end="url(#a)"/>
<text class="small" x="652" y="384" text-anchor="end">Correções</text>
<text class="small" x="652" y="401" text-anchor="end">com seu sim</text>
<text class="small" x="652" y="418" text-anchor="end">até 3 rodadas</text>
<g class="nb"><rect x="710" y="65" width="265" height="80" rx="6"/>
<text class="h" x="842.5" y="90" text-anchor="middle">gpt-optimizer</text>
<text class="" x="842.5" y="112" text-anchor="middle">Opcional: atacar uma decisão grande</text>
<text class="" x="842.5" y="131" text-anchor="middle">antes de aprová-la.</text>
</g>
<g class="nb"><rect x="710" y="190" width="265" height="61" rx="6"/>
<text class="h" x="842.5" y="215" text-anchor="middle">handoff</text>
<text class="" x="842.5" y="237" text-anchor="middle">Continuar em outra conversa.</text>
</g>
<g class="nb"><rect x="710" y="292" width="265" height="61" rx="6"/>
<text class="h" x="842.5" y="317" text-anchor="middle">otimizar-arquitetura</text>
<text class="" x="842.5" y="339" text-anchor="middle">Organizar o código em módulos.</text>
</g>
<g class="nb"><rect x="710" y="394" width="265" height="80" rx="6"/>
<text class="h" x="842.5" y="419" text-anchor="middle">gpt-implementar</text>
<text class="" x="842.5" y="441" text-anchor="middle">Contrato anterior.</text>
<text class="" x="842.5" y="460" text-anchor="middle">Precisa de adaptação a .specs/.</text>
</g>
<path class="ln" d="M340 610 V636" marker-end="url(#a)"/>
<g class="nb"><rect x="125" y="638" width="430" height="80" rx="6"/>
<text class="h" x="340.0" y="663" text-anchor="middle">aprender-com-a-sessao</text>
<text class="" x="340.0" y="685" text-anchor="middle">Rever a sessão e sugerir melhorias.</text>
<text class="" x="340.0" y="704" text-anchor="middle">Depois de revisar e publicar.</text>
</g>
<text class="small" x="840" y="562" text-anchor="middle">Verde: sua decisão.</text>
<text class="small" x="840" y="582" text-anchor="middle">Tracejado: volta para correções.</text>
</svg>
