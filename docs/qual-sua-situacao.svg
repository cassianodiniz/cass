<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 708" width="680" height="708" role="img" aria-labelledby="t d">
<title id="t">Qual skill do cass usar, pela sua situação</title>
<desc id="d">Mapa de porta de entrada, com três jornadas. Sei onde ajustar: direto na spec-plan. Pesquisar ideias: ask-me e depois search. Feature nova: ask-me e depois auto-think. As três seguem pra spec-plan, que vira o plano em partes. Com o plano pronto, se ele for grande e complexo, a gpt-optimizer pode atacá-lo antes da obra (opcional; em mudança simples, pule direto). Depois, implementar (o agente da conversa: Claude, Codex ou outro) ou gpt-implementar (o Claude orquestra subagentes GPT) constroem e build-review confere; se reprovar, volta pro construtor. A qualquer momento, handoff passa o trabalho pra outra conversa. Depois de uma sessão, aprender-com-a-sessao revê como a IA trabalhou e sugere ajustes.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.dash{stroke-dasharray:4 3}
.frame{fill:none;stroke:var(--ns);stroke-width:1;stroke-dasharray:4 3}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
.opt rect{fill:var(--nf);stroke:var(--hs);stroke-width:1.2;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="215" y="16" width="250" height="40" rx="20"/><text class="h" x="340" y="41" text-anchor="middle">Qual é a sua situação?</text>
<path class="ln" d="M340 56 V72 M130 88 V72 H550 V88 M340 72 V88"/>
<g class="nb"><rect x="40" y="90" width="180" height="48" rx="4"/><text class="h" x="130" y="110" text-anchor="middle">Sei onde ajustar</text><text class="s" x="130" y="127" text-anchor="middle">a mudança já está clara</text></g>
<g class="nb"><rect x="250" y="90" width="180" height="48" rx="4"/><text class="h" x="340" y="110" text-anchor="middle">Pesquisar ideias</text><text class="s" x="340" y="127" text-anchor="middle">ver o que já existe</text></g>
<g class="nb"><rect x="460" y="90" width="180" height="48" rx="4"/><text class="h" x="550" y="110" text-anchor="middle">Feature nova</text><text class="s" x="550" y="127" text-anchor="middle">ainda preciso decidir como</text></g>
<line class="ln" x1="340" y1="138" x2="340" y2="148" marker-end="url(#a)"/>
<g class="hot"><rect x="265" y="150" width="150" height="34" rx="4"/><text class="h" x="340" y="172" text-anchor="middle">ask-me</text></g>
<line class="ln" x1="340" y1="184" x2="340" y2="200" marker-end="url(#a)"/>
<g class="hot"><rect x="265" y="202" width="150" height="48" rx="4"/><text class="h" x="340" y="222" text-anchor="middle">search</text><text class="s" x="340" y="239" text-anchor="middle">acha referências</text></g>
<line class="ln" x1="550" y1="138" x2="550" y2="148" marker-end="url(#a)"/>
<g class="hot"><rect x="475" y="150" width="150" height="34" rx="4"/><text class="h" x="550" y="172" text-anchor="middle">ask-me</text></g>
<line class="ln" x1="550" y1="184" x2="550" y2="200" marker-end="url(#a)"/>
<g class="hot"><rect x="475" y="202" width="150" height="48" rx="4"/><text class="h" x="550" y="222" text-anchor="middle">auto-think</text><text class="s" x="550" y="239" text-anchor="middle">estuda e dá veredito</text></g>
<path class="ln" d="M130 138 V270 H550 V250 M340 250 V288" marker-end="url(#a)"/>
<g class="hot"><rect x="250" y="290" width="180" height="48" rx="4"/><text class="h" x="340" y="310" text-anchor="middle">spec-plan</text><text class="s" x="340" y="327" text-anchor="middle">plano em partes</text></g>
<line class="ln" x1="340" y1="338" x2="340" y2="366" marker-end="url(#a)"/>
<text x="350" y="357" text-anchor="start">plano pronto</text>
<g class="opt"><rect x="250" y="368" width="180" height="48" rx="4"/><text class="h" x="340" y="388" text-anchor="middle">gpt-optimizer</text><text class="s" x="340" y="405" text-anchor="middle">opcional: o GPT ataca o plano</text></g>
<text class="lb" x="440" y="388" text-anchor="start">só pra plano grande</text>
<text class="lb" x="440" y="404" text-anchor="start">e complexo</text>
<line class="ln" x1="340" y1="416" x2="340" y2="436" marker-end="url(#a)"/>
<path class="ln dash" d="M250 314 H190 V436" marker-end="url(#a)"/>
<text x="182" y="372" text-anchor="end">mudança simples:</text>
<text x="182" y="388" text-anchor="end">pule direto</text>
<rect class="frame" x="110" y="438" width="460" height="78" rx="4"/>
<g class="hot"><rect x="125.0" y="446" width="190" height="62" rx="4"/><text class="h" x="220" y="466" text-anchor="middle">implementar</text><text class="s" x="220" y="483" text-anchor="middle">agente da conversa constrói</text><text class="s" x="220" y="499" text-anchor="middle">(Claude, Codex, Grok, etc)</text></g>
<text x="340" y="482" text-anchor="middle">ou</text>
<g class="hot"><rect x="365.0" y="446" width="190" height="62" rx="4"/><text class="h" x="460" y="466" text-anchor="middle">gpt-implementar</text><text class="s" x="460" y="483" text-anchor="middle">o Claude orquestra,</text><text class="s" x="460" y="499" text-anchor="middle">subagentes GPT constroem</text></g>
<line class="ln" x1="340" y1="516" x2="340" y2="536" marker-end="url(#a)"/>
<g class="hot"><rect x="250.0" y="538" width="180" height="48" rx="4"/><text class="h" x="340" y="558" text-anchor="middle">build-review</text><text class="s" x="340" y="575" text-anchor="middle">3 revisores conferem</text></g>
<path class="ln dash" d="M430 562 H600 V477 H572" marker-end="url(#a)"/>
<text x="436" y="556" text-anchor="start">reprovou: volta</text>
<line class="ln" x1="340" y1="586" x2="340" y2="604" marker-end="url(#a)"/>
<rect class="pill" x="270" y="606" width="140" height="34" rx="17"/><text class="h" x="340" y="628" text-anchor="middle">pode publicar</text>
<line x1="20" y1="652" x2="660" y2="652" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<text x="20" y="672" text-anchor="start">A qualquer momento: <tspan class="h" style="font-size:12px">handoff</tspan> salva o ponto e passa o trabalho pra uma conversa nova.</text>
<text x="20" y="692" text-anchor="start">Depois de uma sessão: <tspan class="h" style="font-size:12px">aprender-com-a-sessao</tspan> revê como a IA trabalhou e sugere ajustes.</text>
</svg>
