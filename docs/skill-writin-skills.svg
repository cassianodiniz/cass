<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1260" viewBox="0 0 760 1260" role="img" aria-labelledby="t d">
<title id="t">writin-skills · criar, ajustar e testar skills</title>
<desc id="d">Entende o uso, os gatilhos, limites e resultado esperado. Mudanças puramente mecânicas recebem verificação objetiva. Novas skills e mudanças de comportamento definem cenários, critérios, repetições e limite de correções; congelam a versão. RED demonstra falha sem a skill ou contradição documental comprovada em skill existente. Escreve ou ajusta, congela a candidata e executa os testes planejados, com microtestes quando aplicáveis. Falhas voltam ao ajuste dentro do limite; no limite, relata pendências sem aprovar. Depois dos critérios passarem, revisão independente confere a candidata; achados procedentes voltam ao ajuste e aos testes afetados. Finaliza com os arquivos, resultados, limites e publicação conforme o destino e as autorizações.</desc>
<style>svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--ns:#d1d9e0}
@media(prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#a6b0bb;--ln:#9198a1;--ns:#3d444d}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--mu);font-size:16px}
.h{font-size:19px;font-weight:600;fill:var(--tx)}.title{font-size:23px;font-weight:700;fill:var(--tx)}.small{font-size:14px}
.box{fill:transparent;stroke:var(--ns);stroke-width:1.3}.hot{fill:#0f6e56;stroke:#0f6e56}
.ln{fill:none;stroke:var(--ln);stroke-width:1.5}.dash{stroke-dasharray:6 5}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ln" d="M2 1L8 5L2 9"/></marker></defs>
<text x="380" y="36" class="title" text-anchor="middle">writin-skills · criar, ajustar e testar skills</text>
<rect x="70" y="65" width="620" height="82" rx="7" class="box"/>
<text x="380.0" y="93" class="h" text-anchor="middle">Entender o pedido</text>
<text x="380.0" y="118" class="" text-anchor="middle">Uso, gatilhos, limites e o que conta como bom resultado.</text>
<path d="M380 147 V180" class="ln" marker-end="url(#a)"/>
<text x="380" y="204" class="h" text-anchor="middle">Que tipo de mudança é?</text>
<path d="M380 218 H180 V261" class="ln" marker-end="url(#a)"/>
<path d="M380 218 H510 V261" class="ln" marker-end="url(#a)"/>
<rect x="55" y="267" width="250" height="126" rx="7" class="box"/>
<text x="180.0" y="295" class="h" text-anchor="middle">Mecânica</text>
<text x="180.0" y="320" class="" text-anchor="middle">Ortografia, formato ou</text>
<text x="180.0" y="342" class="" text-anchor="middle">link de mesmo sentido.</text>
<text x="180.0" y="364" class="" text-anchor="middle">Verificação objetiva.</text>
<rect x="345" y="267" width="345" height="104" rx="7" class="box"/>
<text x="517.5" y="295" class="h" text-anchor="middle">Nova skill ou comportamento</text>
<text x="517.5" y="320" class="" text-anchor="middle">Definir cenários, critérios e repetições.</text>
<text x="517.5" y="342" class="" text-anchor="middle">Fixar limite de correções e versão.</text>
<path d="M517 371 V404" class="ln" marker-end="url(#a)"/>
<rect x="345" y="410" width="345" height="126" rx="7" class="box"/>
<text x="517.5" y="438" class="h" text-anchor="middle">RED: demonstrar o problema</text>
<text x="517.5" y="463" class="" text-anchor="middle">Falha observada sem a skill,</text>
<text x="517.5" y="485" class="" text-anchor="middle">ou contradição comprovada</text>
<text x="517.5" y="507" class="" text-anchor="middle">em uma skill existente.</text>
<path d="M517 536 V569" class="ln" marker-end="url(#a)"/>
<rect x="345" y="575" width="345" height="82" rx="7" class="box"/>
<text x="517.5" y="603" class="h" text-anchor="middle">Escrever ou ajustar</text>
<text x="517.5" y="628" class="" text-anchor="middle">Corrigir o necessário e congelar a versão.</text>
<path d="M517 657 V690" class="ln" marker-end="url(#a)"/>
<rect x="345" y="696" width="345" height="104" rx="7" class="box"/>
<text x="517.5" y="724" class="h" text-anchor="middle">Testar a versão congelada</text>
<text x="517.5" y="749" class="" text-anchor="middle">Microtestes quando cabem e cenários.</text>
<text x="517.5" y="771" class="" text-anchor="middle">Cumprir as repetições planejadas.</text>
<path d="M345 748 H321 V616 H339" class="ln dash" marker-end="url(#a)"/>
<text x="309" y="638" class="small" text-anchor="end">Falhou: ajustar</text>
<text x="309" y="660" class="small" text-anchor="end">dentro do limite.</text>
<text x="517" y="833" class="small" text-anchor="middle">Atingiu o limite? Relata pendências; não aprova.</text>
<path d="M517 800 V809" class="ln"/>
<path d="M517 841 V876" class="ln" marker-end="url(#a)"/>
<text x="500" y="858" class="small" text-anchor="end">Critérios passaram</text>
<rect x="345" y="882" width="345" height="104" rx="7" class="box"/>
<text x="517.5" y="910" class="h" text-anchor="middle">Revisão independente</text>
<text x="517.5" y="935" class="" text-anchor="middle">Outro contexto confere a candidata.</text>
<text x="517.5" y="957" class="" text-anchor="middle">Achado procedente volta ao ajuste.</text>
<path d="M690 935 H741 V596 H696" class="ln dash" marker-end="url(#a)"/>
<text x="517" y="1021" class="small" text-anchor="middle">Versão corrigida recebe os testes e a revisão afetados.</text>
<path d="M180 393 V1115 H374" class="ln" marker-end="url(#a)"/>
<text x="166" y="577" class="small" text-anchor="end">Sem mudança de</text>
<text x="166" y="599" class="small" text-anchor="end">comportamento:</text>
<text x="166" y="621" class="small" text-anchor="end">sem campanha</text>
<text x="166" y="643" class="small" text-anchor="end">com agentes.</text>
<path d="M517 986 V997" class="ln"/>
<path d="M517 1033 V1115 H386" class="ln" marker-end="url(#a)"/>
<path d="M380 1115 V1145" class="ln" marker-end="url(#a)"/>
<rect x="70" y="1151" width="620" height="82" rx="7" class="box"/>
<text x="380.0" y="1179" class="h" text-anchor="middle">Registrar e entregar</text>
<text x="380.0" y="1204" class="" text-anchor="middle">Arquivos, resultados e limites; commit/push no destino configurado.</text>
</svg>
