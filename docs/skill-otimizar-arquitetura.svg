<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 670" width="520" height="670" role="img" aria-labelledby="t d">
<title id="t">Como a otimizar-arquitetura funciona</title>
<desc id="d">A otimizar-arquitetura entra quando o código vai ser desenhado ou reorganizado. Fixa um vocabulário único, faz o teste da deleção em cada módulo, classifica as dependências em quatro tipos e só cria uma costura quando há dois adaptadores de verdade. Se você quiser ver alternativas, subagentes desenham a interface de três ou mais jeitos bem diferentes e ela compara e recomenda um; senão, segue direto. No fim, os testes passam a morar na interface e os antigos dos módulos rasos saem.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.gh rect{fill:var(--nf);stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.bk{stroke:var(--hs);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lb{fill:var(--hs);font-weight:600}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ahh{fill:none;stroke:var(--hs);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="30.5" y="20" width="319" height="34" rx="17"/><text class="h" x="190" y="42" text-anchor="middle">vai desenhar ou reorganizar código</text>
<line class="ln" x1="190" y1="54" x2="190" y2="76" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="78" width="300" height="47" rx="4"/><text class="h" x="190" y="99" text-anchor="middle">fixa o vocabulário</text><text class="s" x="190" y="117" text-anchor="middle">módulo, interface, profundidade, costura</text></g>
<line class="ln" x1="190" y1="125" x2="190" y2="147" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="149" width="300" height="47" rx="4"/><text class="h" x="190" y="170" text-anchor="middle">teste da deleção</text><text class="s" x="190" y="188" text-anchor="middle">apagado, a complexidade some ou se espalha?</text></g>
<line class="ln" x1="190" y1="196" x2="190" y2="218" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="220" width="300" height="47" rx="4"/><text class="h" x="190" y="241" text-anchor="middle">classifica as dependências</text><text class="s" x="190" y="259" text-anchor="middle">em memória · local · rede própria · externa</text></g>
<line class="ln" x1="190" y1="267" x2="190" y2="289" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="291" width="300" height="47" rx="4"/><text class="h" x="190" y="312" text-anchor="middle">decide onde fica a costura</text><text class="s" x="190" y="330" text-anchor="middle">só cria com 2 adaptadores: produção + teste</text></g>
<line class="ln" x1="190" y1="338" x2="190" y2="360" marker-end="url(#a)"/>
<g class="gh"><rect x="40" y="362" width="300" height="47" rx="4"/><text class="h" x="190" y="383" text-anchor="middle">desenha a interface 3+ vezes</text><text class="s" x="190" y="401" text-anchor="middle">subagentes em paralelo, cada um com uma regra</text></g>
<line class="ln" x1="190" y1="409" x2="190" y2="431" marker-end="url(#a)"/>
<g class="gh"><rect x="40" y="433" width="300" height="47" rx="4"/><text class="h" x="190" y="454" text-anchor="middle">compara e recomenda uma</text><text class="s" x="190" y="472" text-anchor="middle">ou propõe juntar o melhor de duas</text></g>
<line class="ln" x1="190" y1="480" x2="190" y2="502" marker-end="url(#a)"/>
<g class="nb"><rect x="40" y="504" width="300" height="47" rx="4"/><text class="h" x="190" y="525" text-anchor="middle">testes passam a morar na interface</text><text class="s" x="190" y="543" text-anchor="middle">os antigos dos módulos rasos saem</text></g>
<line class="ln" x1="190" y1="551" x2="190" y2="573" marker-end="url(#a)"/>
<rect class="pill" x="20.5" y="575" width="339" height="34" rx="17"/><text class="h" x="190" y="597" text-anchor="middle">interface pequena, muito comportamento atrás</text>
<path class="bk" d="M340 314 H362 V527 H342" marker-end="url(#b)"/>
<text class="lb" x="370" y="410" text-anchor="start"><tspan x="370" dy="0">sem pedir</tspan><tspan x="370" dy="15">alternativas:</tspan><tspan x="370" dy="15">segue direto</tspan></text>
<line x1="16" y1="630" x2="504" y2="630" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<g class="gh"><rect x="24" y="639" width="14" height="12" rx="2"/></g>
<text x="44" y="649">borda tracejada: só se você pedir</text>
<line class="bk" x1="252" y1="645" x2="274" y2="645"/>
<text x="280" y="649">tracejado verde: atalho</text>
</svg>
